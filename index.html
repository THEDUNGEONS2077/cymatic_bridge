<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="cymatic_bridge: a music visualizer for the YouTube tab you share. Nothing leaves this browser." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>CYMATIC BRIDGE</title>
    <!-- The HUD's fonts, fetched at once instead of once the stylesheet asks for them. -->
    <link rel="preload" href="/cymatic_bridge/assets/JetBrainsMono-Regular-CtxPQfgF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/cymatic_bridge/assets/JetBrainsMono-Bold-DxpIpPQ0.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Black before the app's CSS arrives, so a new page never flashes white. -->
    <style>html{background:#000}</style>
    <script type="module" crossorigin src="/cymatic_bridge/assets/index-CgBkXdW7.js"></script>
    <link rel="modulepreload" crossorigin href="/cymatic_bridge/assets/palette-HmKEKF4t.js">
    <link rel="stylesheet" crossorigin href="/cymatic_bridge/assets/index-DJ5V5VaP.css">
    <link rel="modulepreload" crossorigin href="/cymatic_bridge/assets/start-DeJuLlZ8.js">
  </head>
  <body>
    <noscript>
      <p style="font-family: monospace; color: #bb8ef0; background: #000; padding: 24px">&gt; cymatic_bridge needs JavaScript to run.</p>
    </noscript>
    <!-- The visual is plain HTML, so the first script can start it before the app loads (src/scene/host.ts). -->
    <div class="scene" aria-hidden="true">
      <canvas class="scene-canvas" id="scene-canvas"></canvas>
    </div>
    <div id="root"></div>
  </body>
</html>
